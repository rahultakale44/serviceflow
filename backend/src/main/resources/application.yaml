spring:
  application:
    name: serviceflow

  datasource:
    url: jdbc:mysql://localhost:3306/serviceflow
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


# JWT Configuration
# SECURITY: JWT_SECRET environment variable is REQUIRED
# Generate a strong random string (64+ characters) for production
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000 # 1 hour in milliseconds (1000 * 60 * 60)

# Admin User Configuration
# SECURITY: APP_ADMIN_PASSWORD environment variable is REQUIRED for first startup
app:
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    email: ${APP_ADMIN_EMAIL:admin@serviceflow.com}
    password: ${APP_ADMIN_PASSWORD}
    firstName: ${APP_ADMIN_FIRSTNAME:System}
    lastName: ${APP_ADMIN_LASTNAME:Administrator}
