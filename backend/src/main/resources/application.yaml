spring:
  application:
    name: serviceflow

  datasource:
    url: jdbc:mysql://localhost:3306/serviceflow
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


# JWT Configuration
jwt:
  secret: ${JWT_SECRET:ServiceFlowSecretKeyForJWTTokenGenerationMustBeLongEnoughForHS512Algorithm}
  expiration: 3600000 # 1 hour in milliseconds (1000 * 60 * 60)
